    <tspan class="subtitle-letter" style="fill:#3a616e; animation-delay:2.00s">о</tspan>
    <tspan class="subtitle-letter" style="fill:#3e6a76; animation-delay:2.04s">д</tspan>
    <tspan class="subtitle-letter" style="fill:#42737e; animation-delay:2.08s">и</tspan>
    <tspan class="subtitle-letter" style="fill:#467c86; animation-delay:2.12s">т</tspan>
