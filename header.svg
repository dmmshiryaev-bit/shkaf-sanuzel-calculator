<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="800" height="130">
  <defs>
    <style>
      @keyframes appear {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .title-letter {
        opacity: 0;
        animation: appear 0.4s ease forwards;
        font-family: Arial, sans-serif;
        font-weight: 900;
      }
      .subtitle-letter {
        opacity: 0;
        animation: appear 0.3s ease forwards;
        font-family: Arial, sans-serif;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- ШКАФ -->
  <text x="150" y="55" text-anchor="middle" font-size="42">
    <tspan class="title-letter" style="fill:#d4af37; animation-delay:0.00s">Ш</tspan>
    <tspan class="title-letter" style="fill:#c9a961; animation-delay:0.05s">К</tspan>
    <tspan class="title-letter" style="fill:#b8956a; animation-delay:0.10s">А</tspan>
    <tspan class="title-letter" style="fill:#a67c52; animation-delay:0.15s">Ф</tspan>
  </text>

  <!-- ДЛЯ -->
  <text x="400" y="55" text-anchor="middle" font-size="42">
    <tspan class="title-letter" style="fill:#8b6f47; animation-delay:0.25s">Д</tspan>
    <tspan class="title-letter" style="fill:#7d6340; animation-delay:0.30s">Л</tspan>
    <tspan class="title-letter" style="fill:#6f5739; animation-delay:0.35s">Я</tspan>
  </text>

  <!-- САНУЗЛА -->
  <text x="650" y="55" text-anchor="middle" font-size="42">
    <tspan class="title-letter" style="fill:#53402b; animation-delay:0.45s">С</tspan>
    <tspan class="title-letter" style="fill:#453524; animation-delay:0.50s">А</tspan>
    <tspan class="title-letter" style="fill:#372a1d; animation-delay:0.55s">Н</tspan>
    <tspan class="title-letter" style="fill:#292016; animation-delay:0.60s">У</tspan>
    <tspan class="title-letter" style="fill:#1b1610; animation-delay:0.65s">З</tspan>
    <tspan class="title-letter" style="fill:#1a3a4a; animation-delay:0.70s">Л</tspan>
    <tspan class="title-letter" style="fill:#2a5a6a; animation-delay:0.75s">А</tspan>
  </text>

  <!-- Подзаголовок: Мебель на заказ от производителя -->
  <text x="130" y="100" text-anchor="middle" font-size="20">
    <tspan class="subtitle-letter" style="fill:#8b7355; animation-delay:1.00s">М</tspan>
    <tspan class="subtitle-letter" style="fill:#846d52; animation-delay:1.04s">е</tspan>
    <tspan class="subtitle-letter" style="fill:#7d674f; animation-delay:1.08s">б</tspan>
    <tspan class="subtitle-letter" style="fill:#76614c; animation-delay:1.12s">е</tspan>
    <tspan class="subtitle-letter" style="fill:#6f5b49; animation-delay:1.16s">л</tspan>
    <tspan class="subtitle-letter" style="fill:#685546; animation-delay:1.20s">ь</tspan>
  </text>

  <text x="265" y="100" text-anchor="middle" font-size="20">
    <tspan class="subtitle-letter" style="fill:#614f43; animation-delay:1.24s">н</tspan>
    <tspan class="subtitle-letter" style="fill:#5a4940; animation-delay:1.28s">а</tspan>
  </text>

  <text x="370" y="100" text-anchor="middle" font-size="20">
    <tspan class="subtitle-letter" style="fill:#53433d; animation-delay:1.32s">з</tspan>
    <tspan class="subtitle-letter" style="fill:#4c3d3a; animation-delay:1.36s">а</tspan>
    <tspan class="subtitle-letter" style="fill:#453737; animation-delay:1.40s">к</tspan>
    <tspan class="subtitle-letter" style="fill:#3e3134; animation-delay:1.44s">а</tspan>
    <tspan class="subtitle-letter" style="fill:#372b31; animation-delay:1.48s">з</tspan>
  </text>

  <text x="490" y="100" text-anchor="middle" font-size="20">
    <tspan class="subtitle-letter" style="fill:#30252e; animation-delay:1.52s">о</tspan>
    <tspan class="subtitle-letter" style="fill:#291f2b; animation-delay:1.56s">т</tspan>
  </text>

  <text x="655" y="100" text-anchor="middle" font-size="20">
    <tspan class="subtitle-letter" style="fill:#221928; animation-delay:1.60s">п</tspan>
    <tspan class="subtitle-letter" style="fill:#1b1325; animation-delay:1.64s">р</tspan>
    <tspan class="subtitle-letter" style="fill:#1a1a2e; animation-delay:1.68s">о</tspan>
    <tspan class="subtitle-letter" style="fill:#1e2236; animation-delay:1.72s">и</tspan>
    <tspan class="subtitle-letter" style="fill:#222b3e; animation-delay:1.76s">з</tspan>
    <tspan class="subtitle-letter" style="fill:#263446; animation-delay:1.80s">в</tspan>
    <tspan class="subtitle-letter" style="fill:#2a3d4e; animation-delay:1.84s">о</tspan>
    <tspan class="subtitle-letter" style="fill:#2e4656; animation-delay:1.88s">д</tspan>
    <tspan class="subtitle-letter" style="fill:#324f5e; animation-delay:1.92s">и</tspan>
    <tspan class="subtitle-letter" style="fill:#365866; animation-delay:1.96s">т</tspan>
    <tspan class="subtitle-letter" style="fill:#3a616e; animation-delay:2.00s">е</tspan>
    <tspan class="subtitle-letter" style="fill:#3e6a76; animation-delay:2.04s">л</tspan>
    <tspan class="subtitle-letter" style="fill:#42737e; animation-delay:2.08s">я</tspan>
  </text>
</svg>
