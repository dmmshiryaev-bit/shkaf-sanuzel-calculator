    <tspan class="subtitle-letter" style="fill:#221928; animation-delay:1.60s"> </tspan>
    <tspan class="subtitle-letter" style="fill:#1b1325; animation-delay:1.64s">о</tspan>
    <tspan class="subtitle-letter" style="fill:#1a1a2e; animation-delay:1.68s">т</tspan>
    <tspan class="subtitle-letter" style="fill:#1e2236; animation-delay:1.72s"> </tspan>
    <tspan class="subtitle-letter" style="fill:#222b3e; animation-delay:1.76s">п</tspan>
    <tspan class="subtitle-letter" style="fill:#263446; animation-delay:1.80s">р</tspan>
    <tspan class="subtitle-letter" style="fill:#2a3d4e; animation-delay:1.84s">о</tspan>
